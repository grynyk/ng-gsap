<app-example-page title="Basic tween" source="basic-tween" entryPoint="ng-gsap">
  <p>
    <code>injectGSAP</code> runs its callback inside an Angular render effect. Nothing here declares
    what the animation depends on: Angular tracks the signals you read, and <code>open()</code> is
    read inside the callback. Click the box — nothing else is wired up.
  </p>

  <div class="example-stage" #container>
    <button class="box" type="button" (click)="toggle()" aria-label="Toggle the tween"></button>
  </div>

  <app-code-preview [code]="snippet" />
</app-example-page>
