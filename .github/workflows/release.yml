name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1 or later; Node 24 ships npm 11.6.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Nothing bumps the version automatically, so make a mismatch loud here
      # rather than silently publishing whatever happens to be committed.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./projects/ng-gsap/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package version $PKG" >&2
            exit 1
          fi

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Build ng-gsap
        run: yarn build:lib

      - name: Lint
        run: yarn lint

      - name: Test (jsdom, with coverage thresholds)
        run: yarn test:coverage --watch=false

      - name: Test (Chromium)
        run: yarn test:browser --watch=false

      - name: Build docs site (prerendered)
        run: yarn build:playground

      - name: Verify prerendered output
        run: yarn verify:ssr

      - name: End-to-end
        run: yarn e2e

      # Installs the tarball into a throwaway app: the only check that covers
      # the published exports map, peer ranges and the ng-add schematic.
      - name: Verify the package from outside
        run: yarn verify:package

      # `npm stage` (used below for the very first version) needs npm 11.15+;
      # Node 24 ships 11.6.
      - name: Update npm
        run: npm install -g npm@11 && npm --version

      # Two ways to authenticate; npm itself tries them in this order:
      #
      # 1. Trusted publishing (OIDC). Once the package exists on npm, register
      #    this workflow as its trusted publisher, either in the package
      #    settings on npmjs.com or with
      #      npm trust github ng-gsap --file release.yml --repo grynyk/ng-gsap --allow-publish
      #    No token to store or rotate.
      # 2. An NPM_TOKEN repository secret: a granular access token with
      #    "Read and write (publish and stage)" on all packages. Only needed
      #    until trusted publishing is registered; delete the secret and
      #    revoke the token then.
      #
      # The very first version is a special case: a trusted publisher cannot
      # be registered before the package exists, so only the token path can
      # create it. The token must allow "All packages" (one limited to a scope
      # cannot create an unscoped name). If the registry still refuses the
      # direct publish, fall back to `npm stage publish`, which creates the
      # package and queues the version for a maintainer to approve once, with
      # 2FA, on npmjs.com (Staged Packages) or via `npm stage approve <id>`.
      #
      # --provenance attaches a signed build attestation on every path.
      #
      # A version that already exists is skipped rather than failed, so
      # re-running a release after a transient failure is safe.
      - name: Publish to npm
        working-directory: dist/ng-gsap
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "ng-gsap@$VERSION" version 2>/dev/null)" ]; then
            echo "ng-gsap@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          case "$VERSION" in
            *-*) DIST_TAG="--tag next" ;; # pre-releases must never become `latest`
            *) DIST_TAG="" ;;
          esac
          if npm publish --access public --provenance $DIST_TAG; then
            exit 0
          fi
          if [ -n "$(npm view ng-gsap name 2>/dev/null)" ]; then
            echo "::error::Direct publish of ng-gsap@$VERSION was refused and the package already exists; check the token or the trusted publisher."
            exit 1
          fi
          echo "::warning::Direct publish was refused for a package that does not exist yet; staging it instead."
          npm stage publish --access public --provenance $DIST_TAG
          echo "::notice::ng-gsap@$VERSION is staged. Approve it on npmjs.com under Staged Packages, or run: npm stage approve <stage-id>"
