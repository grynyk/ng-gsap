name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Enable corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Nothing bumps the version automatically, so make a mismatch loud here
      # rather than silently publishing whatever happens to be committed.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./projects/ng-gsap/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package version $PKG" >&2
            exit 1
          fi

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Build ng-gsap
        run: yarn build:lib

      - name: Lint
        run: yarn lint

      - name: Test (jsdom, with coverage thresholds)
        run: yarn test:coverage --watch=false

      - name: Test (Chromium)
        run: yarn test:browser --watch=false

      - name: Build docs site (prerendered)
        run: yarn build:playground

      - name: Verify prerendered output
        run: yarn verify:ssr

      - name: End-to-end
        run: yarn e2e

      # Installs the tarball into a throwaway app: the only check that covers
      # the published exports map, peer ranges and the ng-add schematic.
      - name: Verify the package from outside
        run: yarn verify:package

      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: dist/ng-gsap
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
