name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Enable corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build ng-gsap
        run: yarn build:lib

      - name: Build playground
        run: yarn build:playground

      # Every route is prerendered to its own index.html, so deep links resolve
      # directly. 404.html only catches URLs that don't match a route at all.
      - name: Fallback for unknown URLs
        run: cp dist/playground/browser/index.html dist/playground/browser/404.html

      - name: Verify prerendered output
        run: yarn verify:ssr

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/playground/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
